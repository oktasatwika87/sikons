name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # PAKAI NAMA YANG SAMA DENGAN MAKEFILE — variabel ini dibaca oleh `make test`.
  TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/sikons_test?sslmode=disable"

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRURES_DB: sikons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kode sumber
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt — gagal kalau ada file belum diformat.
      - name: Periksa format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "File belum diformat gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Analisis statis
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Siapkan database dan jalankan migrasi.
      # migrate CLI tidak tersedia di repo apt, jadi diunduh langsung dari
      # release GitHub. Versi dipinning sama dengan docker-compose.yml
      # (migrate/migrate:v4.17.1) supaya perilaku migrasi lokal dan CI identik.
      - name: Siapkan database uji
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          until pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; do sleep 1; done
          curl -fsSL -o /tmp/migrate.tgz \
            https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz
          tar -xzf /tmp/migrate.tgz -C /tmp && sudo mv /tmp/migrate /usr/local/bin/migrate
          migrate -version
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE sikons_test;" 2>/dev/null || true
          migrate -path=migrations -database="$TEST_DATABASE_URL" -verbose up

      - name: Test dengan race detector
        run: go test ./... -race -count=1

      # Coverage bukan gate — hanya info di job summary.
      - name: Ringkasan coverage
        run: |
          go test ./... -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out | tee "$GITHUB_STEP_SUMMARY"
          rm coverage.out

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Explicitly set false: runner GitHub Actions Linux mungkin me-reuse
      # env var dari workflow sebelumnya (yang pakai --ignore-scripts).
      # Ini memastikan npm ci dijalankan dengan perilaku standar.
      npm_config_ignore_scripts: "false"

    steps:
      - name: Kode sumber
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Cache dinonaktifkan: runner mungkin punya state npmrc yang tidak
          # terduga dengan ignore-scripts. Cache restore dari previous run
          # yang gagal bisa membawa state yang salah.
          # cache: "npm"
          # cache-dependency-path: web/package-lock.json

      - name: Install dependensi
        run: |
          echo "=== env: ignore ==="
          env | grep -i ignore || echo "(clean)"
          echo "=== npm version ==="
          npm --version
          echo "=== .npmrc global ==="
          cat ~/.npmrc 2>/dev/null || echo "(tidak ada)"
          echo "=== npm ci ==="
          npm ci --ignore-scripts=false

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test -- --run

      - name: Build
        run: npm run build

  # ── Repo lint ──────────────────────────────────────────────────────────────
  repo-integrity:
    name: Repo integrity
    runs-on: ubuntu-latest
    # Working tree selalu bersih saat di-pull request, tapi step ini
    # tetap jalan di push untuk menangkap masalah sejak awal.
    steps:
      - name: Kode sumber
        uses: actions/checkout@v4

      # Hook lokal (.git/hooks/pre-commit) memindai SEMUA tracked file
      # tanpa pengecualian ekstensi. Tapi perl dalam mode -CSD (UTF-8 strict)
      # akan FATAL pada byte yang bukan UTF-8 valid — file biner seperti
      # favicon.ico akan menyebabkan "Malformed UTF-8 character (fatal)"
      # dan exit 25, padahal hook asli tidak crash di file itu karena
      # membacanya byte-stream (bukan UTF-8).
      #
      # Solusi: dalam satu program perl, cek dulu apakah file mengandung null
      # byte (signature khas biner). Kalau ya, skip. Kalau tidak, scan UTF-8.
      # Pendekatan ini portable (perl ada di ubuntu-latest dan macOS), tanpa
      # dependency `file` atau `grep -P` (yang perilakunya beda antar OS),
      # dan mempertahankan logika "scan semua file teks" yang konsisten
      # dengan hook lokal.
      - name: Periksa aksara non-Latin
        run: |
          perl -CSD -e '
            use strict;
            use warnings;
            my $gagal = 0;
            open my $ls, "-|", "git", "ls-files" or die "git ls-files: $!";
            while (my $file = <$ls>) {
              chomp $file;
              next unless -f $file;
              open my $fh, "<:raw", $file or do {
                warn "skip (tidak bisa dibuka): $file\n";
                next;
              };
              my $content = do { local $/; <$fh> };
              close $fh;
              # Skip file biner (signature null byte) — perl UTF-8 strict
              # akan fatal di sini, bukan ASCII artefak yang seharusnya.
              next if $content =~ /\0/;
              open my $th, "<:encoding(UTF-8)", \$content or die;
              while (<$th>) {
                if (/[\x{3000}-\x{30ff}\x{4e00}-\x{9fff}\x{ac00}-\x{d7af}\x{ff00}-\x{ffef}\x{1f300}-\x{1faff}]/) {
                  print "$file:$.: $_";
                  $gagal = 1;
                }
              }
              close $th;
            }
            close $ls;
            exit($gagal ? 1 : 0);
          '

      - name: Periksa file perkakas eksternal
        run: |
          echo "=== git ls-files output ==="
          git ls-files | tee /tmp/all_files.txt
          echo "=== grep matched ==="
          MATCHED=$(git ls-files | grep -i -E '^CLAUDE\.md$|^\.claude/|^\.cursor/|^\.aider|AGENTS\.md')
          echo "matched=[$MATCHED]"
          echo "matched_len=${#MATCHED}"
          echo "matched_lines=$(echo "$MATCHED" | wc -l)"
          if [ -n "$MATCHED" ]; then
            echo "ERROR: file terlarang ditemukan:"
            echo "$MATCHED"
            exit 1
          fi
          echo "PASS: tidak ada file perkakas eksternal"

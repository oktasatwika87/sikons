name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # Port 5432 (port default Postgres di dalam service container runner),
  # BUKAN 5433 seperti port Postgres lokal di laptop. Service container
  # memetakan port kontainer ke localhost dengan port kontainer = 5432.
  TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/sikons_test?sslmode=disable"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sikons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        # `gofmt -l .` mencantumkan path file yang BELUM diformat. Kalau output
        # kosong, semuanya rapi. Lebih ringan daripada `gofmt -d` (diff) karena
        # kita hanya butuh tahu ada/tidak file yang perlu diformat ulang.
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "File berikut belum diformat gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Siapkan database uji. Sama persis seperti Makefile `make test-db`,
      # TAPI lewat CLI langsung, bukan `docker compose run`, karena runner
      # Linux tidak butuh Docker-in-Docker untuk service container.
      - name: Setup database uji
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          until pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; do sleep 1; done
          curl -fsSL -o /tmp/migrate.tgz \
            https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz
          tar -xzf /tmp/migrate.tgz -C /tmp && sudo mv /tmp/migrate /usr/local/bin/migrate
          migrate -version
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE sikons_test;" 2>/dev/null || true
          migrate -path=migrations -database="$TEST_DATABASE_URL" -verbose up

      # Guard 1: cegah hijau palsu kalau TEST_DATABASE_URL tidak di-set.
      # env: di level workflow sudah mengisinya, tapi kalau env itu dihapus
      # atau ditimpa oleh caller (workflow_call, secrets kosong, dsb.),
      # TestMain di package integrasi akan os.Exit(0) diam-diam; CI tampak
      # hijau tanpa satu pun test berjalan. Guard ini gagal cepat.
      - name: Guard TEST_DATABASE_URL terisi
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL kosong; test integrasi akan os.Exit(0) tanpa menjalankan apa pun."
            exit 1
          fi
          echo "TEST_DATABASE_URL=${TEST_DATABASE_URL}"

      # Jalankan test dengan -v. Makefile `make test` tidak memakai -v, dan
      # Mengubah Makefile hanya untuk CI akan membuat perbedaan antara
      # perintah lokal dan CI lebih buruk. Maka kita panggil `go test`
      # langsung di sini, dengan argumen yang PERSIS sama dengan `make test`
      # ditambah -v. Output di-tee ke file untuk Guard 2 & 3.
      # `set -o pipefail` + exit ${PIPESTATUS[0]} memastikan exit code
      # `go test` tidak hilang di pipeline `| tee`.
      - name: Test integrasi + unit dengan race detector
        run: |
          set -o pipefail
          go test ./... -race -count=1 -v 2>&1 | tee /tmp/test-output.log
          exit "${PIPESTATUS[0]}"

      # Guard 2: assertion positif: setiap tes kritis HARUS muncul sebagai
      # --- PASS di output. Kalau satu pun hilang, GAGAL. Alasannya:
      #
      # (a) Slotgen TestMain diam-diam os.Exit(0) kalau DB tidak bisa di-ping
      #     (lihat internal/slotgen/integration_test.go), tanpa guard ini,
      #     job akan hijau walaupun tidak ada tes slotgen yang berjalan.
      # (b) Tes-tes ini adalah yang membuktikan klaim utama project (anti
      #     double-booking + idempotency + rotasi refresh + penguncian
      #     Postgres). Menghilangkannya tanpa sengaja harus ditolak CI.
      - name: Guard assertion tes kritis hadir sebagai PASS
        run: |
          OUT=/tmp/test-output.log
          TES=(
            "TestCreate_SeratusRequestParalelHanyaSatuYangMenang"
            "TestCreate_SatuMahasiswaMenembakSepuluhSlotSekaligus"
            "TestCancel_BarengReconcileTidakDeadlock"
            "TestReminderConcurrencyVerify_SKIP_LOCKED"
            "TestCreateBooking_HappyPath"
            "TestCreateBooking_ConcurrencyDenganIdempotencyKey"
            "TestRefresh_ParalelRefreshTokenSama"
            "TestReconcile_AturanSeninSlot30Menit"
            "TestGetSlots_SlotStartsInRangeButEndsAfterTo"
          )
          hilang=()
          for t in "${TES[@]}"; do
            # Pakai literal space sebagai anchor: go test -v SELALU menulis
            # "--- PASS: <name> (<duration>)", jadi nama tes selalu diikuti
            # spasi lalu "(<duration>)". Tanpa anchor eksplisit, prefix
            # match bisa lolos ("TestCreate" cocok "TestCreate_X").
            if ! grep -q "^--- PASS: ${t} " "$OUT"; then
              hilang+=("$t")
            fi
          done
          if [ ${#hilang[@]} -gt 0 ]; then
            echo "Tes kritis berikut TIDAK memiliki baris '--- PASS:' di output:"
            for t in "${hilang[@]}"; do
              echo "  - $t"
            done
            exit 1
          fi
          echo "Semua tes kritis hadir sebagai PASS."

      # Guard 3: tolak output yang mengandung --- SKIP atau string
      # 'dilewati' (dipakai beberapa TestMain saat DB kosong). Tes integrasi
      # di project ini TIDAK BOLEH di-skip; kalau DB tidak tersedia,
      # tes harus FAIL dengan exit code != 0, bukan diam-diam lewat.
      - name: Guard tanpa SKIP atau dilewati
        run: |
          OUT=/tmp/test-output.log
          if grep -q -E "^--- SKIP" "$OUT"; then
            echo "Ada baris '--- SKIP:' di output tes:"
            grep -E "^--- SKIP" "$OUT" | head -20
            exit 1
          fi
          if grep -q -E "dilewati" "$OUT"; then
            echo "Ada string 'dilewati' di output tes (kemungkinan TestMain diam-diam lewat):"
            grep -E "dilewati" "$OUT" | head -20
            exit 1
          fi
          echo "Tidak ada SKIP/dilewati."

      # Coverage bukan gate, hanya info di job summary. Tes sudah divalidasi
      # oleh Guard 1-3 di atas; coverage ditambahkan untuk visibilitas saja.
      - name: Coverage ringkasan
        run: |
          go test ./... -coverprofile=/tmp/coverage.out -count=1
          go tool cover -func=/tmp/coverage.out | tee "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependensi
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    needs: [backend, frontend]
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sikons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Port 5432 (default kontainer), bukan 5433 seperti Postgres lokal.
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/sikons_test?sslmode=disable"
      # Cookie refresh terikat host: pakai localhost di semua URL (CORS, baseURL, webServer.url, NEXT_PUBLIC_API_URL).
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      HTTP_PORT: "8080"
      APP_ENV: "development"
      # Kredensial dosen demo (lihat cmd/seed/main.go). Default di spec sama.
      E2E_DOSEN_EMAIL: "budi@sikons.test"
      E2E_DOSEN_PASSWORD: "password123"
      E2E_DOSEN_NAME: "Dr. Budi Santoso"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Pasang psql + migrate CLI langsung (tanpa docker compose, seperti job backend).
      - name: Pasang postgres client + migrate CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          until pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; do sleep 1; done
          curl -fsSL -o /tmp/migrate.tgz \
            https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz
          tar -xzf /tmp/migrate.tgz -C /tmp && sudo mv /tmp/migrate /usr/local/bin/migrate
          migrate -version

      - name: Migrasi schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE sikons_test;" 2>/dev/null || true
          migrate -path=migrations -database="$DATABASE_URL" -verbose up

      # JWT_SECRET dibangkitkan saat job jalan, bukan nilai tetap di YAML.
      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # make seed & generate-slots = go run ./cmd/...; tidak butuh docker compose, DATABASE_URL diwarisi otomatis.
      - name: Seed data demo
        run: make seed

      - name: Generate slot untuk dosen aktif
        run: make generate-slots

      - name: Build api binary
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/api

      - name: Install dependensi web
        working-directory: web
        run: npm ci

      # --with-deps memasang dependency OS (libnss3, libxkbcommon) yang dibutuhkan Chromium.
      - name: Install browser Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        working-directory: web
        run: npm run build

      # webServer di config menyalakan api + next start; reuseExistingServer false di CI; env dari process.env diwarisi ke keduanya.
      - name: Jalankan Playwright
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results
          retention-days: 7

  repo-lint:
    name: Repo lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Regex sama dengan .git/hooks/pre-commit langkah 2, dan sama-sama pakai
      # perl seperti hook-nya. Bedanya cuma himpunan file: hook memindai file
      # staged, CI memindai semua file teks yang di-track.
      #
      # Kenapa bukan `git grep -P` lagi: di git yang PCRE-nya tidak jalan dalam
      # mode UTF, pola \x{3000} dst ditolak ("code point too large"). Versi lama
      # membuang stderr + `|| true`, jadi error itu tertelan dan step tetap
      # hijau tanpa memindai apa pun. Sekarang:
      #   - daftar file teks diambil dari `git grep -I -l -e ''` (biner dilewati),
      #   - perl gagal = step gagal (tidak ada `|| true` di jalur pemindaian),
      #   - ada uji mandiri: kalau pola tidak mengenali satu karakter CJK
      #     contoh, step langsung gagal, bukan lolos diam-diam.
      - name: non-latin-script-check
        run: |
          POLA='[\x{3000}-\x{30ff}\x{4e00}-\x{9fff}\x{ac00}-\x{d7af}\x{ff00}-\x{ffef}\x{1f300}-\x{1faff}]'
          if ! printf '\xe4\xb8\xad\n' | perl -CSD -ne "exit 1 unless /$POLA/"; then
            echo "Pemindai gagal mengenali karakter uji, hasil scan tidak bisa dipercaya."
            exit 1
          fi
          ASING=$(git grep -I -z -l -e '' -- . | xargs -0 perl -CSD -ne "print \"\$ARGV:\$.: \$_\" if /$POLA/; close ARGV if eof")
          if [ -n "$ASING" ]; then
            echo "Ditemukan aksara non-Latin / emoji di file:"
            echo "$ASING" | sed 's/^/  /'
            exit 1
          fi
          echo "Tidak ada aksara non-Latin / emoji."

      # Cegah karakter Unicode yang tidak perlu: em-dash, en-dash, panah,
      # box-drawing. Bahasa Indonesia dan Inggris tidak butuh semuanya.
      # em-dash (U+2014) dan en-dash (U+2013) diganti dengan koma, titik dua,
      # atau tanda kurung; panah (U+2190..U+21FF) jadi "->" di kode dan
      # "lalu"/"ke" di prosa; box-drawing (U+2500..U+257F) dipakai cuma untuk
      # dekorasi, bukan untuk isi.
      - name: forbidden-unicode-punctuation-check
        run: |
          POLA='[\x{2013}\x{2014}\x{2190}-\x{21ff}\x{2500}-\x{257f}]'
          # Uji mandiri: tiga karakter contoh (em-dash, panah kanan, box-drawing)
          # harus dikenali. Kalau salah satu lolos, pemindai tidak bisa dipercaya.
          for CO in $'\xe2\x80\x94' $'\xe2\x86\x92' $'\xe2\x94\x80'; do
            if ! printf '%s\n' "$CO" | perl -CSD -ne "exit 1 unless /$POLA/"; then
              echo "Pemindai gagal mengenali karakter uji, hasil scan tidak bisa dipercaya."
              exit 1
            fi
          done
          ASING=$(git grep -I -z -l -e '' -- . | xargs -0 perl -CSD -ne "print \"\$ARGV:\$.: \$_\" if /$POLA/; close ARGV if eof")
          if [ -n "$ASING" ]; then
            echo "Ditemukan em-dash/en-dash/panah/box-drawing di file:"
            echo "$ASING" | sed 's/^/  /'
            exit 1
          fi
          echo "Tidak ada em-dash/en-dash/panah/box-drawing."
